[project]
name = "loopaware-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "torchaudio==2.9.0",
    "transformers==4.57.6",
    "accelerate>=1.15.0",
    "hf-transfer>=0.1.9",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "datasets>=5.0.1",
]

[project.scripts]
loopaware-agent = "loopaware_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
